[project]
name = "liraz-tools"
version = "0.1.0"
description = "LiraZ Tools — desktop app pra gerenciar lojas Mercado Livre"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "httpx>=0.27.0",
    "sqlalchemy>=2.0.35",
    "aiosqlite>=0.20.0",
    "cryptography>=43.0.0",
    "structlog>=24.4.0",
    "openpyxl>=3.1.5",
    "python-multipart>=0.0.18",  # >=0.0.18 corrige CVE-2024-53981 (ReDoS no parse multipart)
    "matplotlib>=3.9.0",         # geração de gráficos PNG pros relatórios diários
    "reportlab>=4.2.0",          # composição dos PDFs (Fatia 1 de relatórios)
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.0",
    "httpx>=0.27.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/liraz_tools"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "C4", "UP", "N", "SIM",
    "RUF", "PL", "PT", "TID", "ARG", "PTH", "ERA",
]
ignore = [
    "PLR0913",  # too many args
    "PLR2004",  # magic value
    "PLR0911",  # too many returns
    "PLR0912",  # too many branches — consistente c/ as outras métricas PLR
    "PLR0915",  # too many statements — renderers/calculator são grandes de propósito
    "PLW0603",  # global p/ singleton — padrão deliberado dos caches/holders
    "B008",     # call em default de arg — idioma do FastAPI (Depends/File)
    "PLC0415",  # import dentro de função — lazy import deliberado (infra pesada/ciclos)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "PLR2004"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --strict-markers --cov=liraz_tools --cov-report=term-missing"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

# openpyxl não publica stubs; os de terceiros (types-openpyxl) são incompletos
# e geram mais ruído do que valor. Ignora só o import desse módulo.
[[tool.mypy.overrides]]
module = ["openpyxl", "openpyxl.*"]
ignore_missing_imports = true

# matplotlib publica stubs parciais mas várias APIs ainda escapam. Pra evitar
# cascata de erros estranhos no renderer, ignora.
[[tool.mypy.overrides]]
module = ["matplotlib", "matplotlib.*"]
ignore_missing_imports = true

# reportlab não publica stubs; os de terceiros são parciais.
[[tool.mypy.overrides]]
module = ["reportlab", "reportlab.*"]
ignore_missing_imports = true
